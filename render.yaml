services:
  # Static Site
  - type: web
    name: portfolio-website
    env: static
    buildCommand: npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: 18
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
